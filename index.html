function grid(id,k,items){const g=$(id),old=new Map(Array.from(g.querySelectorAll(":scope>.card")).map(c=>[c.dataset.id,c]));if(!items.length){old.forEach(c=>c.remove());let e=g.querySelector(":scope>.empty");if(!e){e=document.createElement("div");e.className="empty";g.appendChild(e)}e.textContent=filter==="all"?({todo:"Dodaj tytuł z wyszukiwarki.",watching:"Tu pokażą się rzeczy, które oglądasz.",done:"Obejrzane filmy i seriale pokażą się tutaj."}[k]):"Brak tytułów na tej platformie.";return}g.querySelector(":scope>.empty")?.remove();const keep=new Set();items.forEach((x,i)=>{let c=old.get(String(x.id));if(!c){c=document.createElement("article");c.className="card";c.dataset.id=x.id;g.appendChild(c);c._snap=""}c.dataset.k=k;c.draggable=sort==="manual";const snap=JSON.stringify(x);if(c._snap!==snap){c.innerHTML=cardHTML(x,k);c._snap=snap;c.style.animationDelay=Math.min(i*35,280)+"ms"}keep.add(String(x.id));const before=g.children[i];if(before!==c)g.insertBefore(c,before||null)});old.forEach((c,id)=>{if(!keep.has(id))c.remove()})}

async function api(path){const r=await fetch("https://api.themoviedb.org/3"+path,{headers:{accept:"application/json",Authorization:"Bearer "+TMDB_TOKEN}});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw Error(r.status===401?"TMDB odrzuciło klucz.":j.status_message||"Błąd TMDB "+r.status);return j}

function providerMatch(name,s){const n=String(name||"").toLowerCase();if(s==="Netflix")return n.includes("netflix");if(s==="Disney+")return n.includes("disney");if(s==="HBO Max")return n.includes("hbo")||/\bmax\b/.test(n);return n.includes("amazon")||n.includes("prime video")}

async function openAdd(x){pending=x;$("addtitle").textContent=x.title||x.name;$("addmeta").textContent=(x.media_type==="tv"?"Serial":"Film")+" · "+((x.release_date||x.first_air_date||"").slice(0,4)||"bez roku");$("addposter").src=img(x.poster_path,"w342");$("providerStatus").textContent="Sprawdzam dostępność w Polsce…";$("choices").innerHTML="";providerOptions=[];show($("addmodal"));results.classList.remove("open");try{const kind=x.media_type==="tv"?"tv":"movie",j=await api("/"+kind+"/"+x.id+"/watch/providers"),pl=j.results&&j.results.PL;if(!pl)throw Error("Brak danych regionalnych");const providers=["flatrate","free","ads","rent","buy"].flatMap(k=>pl[k]||[]);providerOptions=SERVICES.filter(s=>providers.some(p=>providerMatch(p.provider_name,s)));$("providerStatus").textContent=providerOptions.length?"Dostępność w Polsce · dane JustWatch przez TMDB.":"Brak tych serwisów w polskiej ofercie TMDB.";renderProviderChoices()}catch(_){providerOptions=SERVICES.slice();$("providerStatus").textContent="Nie udało się pobrać dostępności. Możesz wybrać ręcznie.";renderProviderChoices()}}
$("addconfirm").onclick=()=>{if(!pending)return;if(all().some(a=>Number(a.x.tmdb)===Number(pending.id)&&a.x.kind===pending.media_type)){toast("Ten tytuł już jest w bibliotece.");close($("addmodal"));return}const x=pending,item={id:"m"+Date.now()+Math.random().toString(36).slice(2,6),tmdb:x.id,kind:x.media_type,title:x.title||x.name,poster:x.poster_path||"",backdrop:x.backdrop_path||"",desc:x.overview||"",date:x.release_date||x.first_air_date||"",rating:Number(x.vote_average||0),services:Array.from($("choices").querySelectorAll("input:checked")).map(i=>i.value),added:Date.now()};data[$("status").value].unshift(item);save();render();close($("addmodal"));toast("Dodano „"+item.title+"”.")};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close($(b.dataset.close)));document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)close(m)});document.querySelectorAll(".service-filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".service-filter").forEach(x=>x.classList.toggle("active",x===b));render()});$("sort").value=["manual","added","title","rating","year"].includes(sort)?sort:"manual";$("sort").onchange=()=>{sort=$("sort").value;localStorage.setItem("ftv_sort",sort);render()};
function setPhoto(i){if(!lightboxPhotos.length)return;lightboxIndex=Math.max(0,Math.min(i,lightboxPhotos.length-1));$("lightboxImage").src=lightboxPhotos[lightboxIndex];$("lightboxCount").textContent=(lightboxIndex+1)+" z "+lightboxPhotos.length+" zdjęć";$("lightboxPrev").disabled=lightboxIndex===0;$("lightboxNext").disabled=lightboxIndex===lightboxPhotos.length-1}

async function details(x){detail=x;lightboxPhotos=[];$("detailposter").src=img(x.poster);$("detailtitle").textContent=x.title;$("detailmeta").textContent=(x.kind==="tv"?"Serial":"Film")+" · "+year(x);$("rating").textContent=x.rating?"★ "+Number(x.rating).toFixed(1)+" / 10":"Brak oceny";$("description").textContent=x.desc||"Brak opisu.";$("detailservices").textContent=(x.services||[]).join(" · ")||"Nie wybrano platformy.";$("images").textContent="Wczytuję…";$("videos").textContent="Wczytuję…";show($("detailmodal"));try{const d=await api("/"+(x.kind==="tv"?"tv":"movie")+"/"+x.tmdb+"?"+new URLSearchParams({language:"pl-PL",append_to_response:"videos,images",include_image_language:"pl,en,null"}));x.desc=d.overview||x.desc;x.rating=Number(d.vote_average||x.rating||0);x.date=d.release_date||d.first_air_date||x.date;x.genres=(d.genres||[]).map(g=>g.name);save();if(detail!==x)return;$("detailmeta").textContent=(x.kind==="tv"?"Serial":"Film")+" · "+year(x)+(x.genres.length?" · "+x.genres.join(", "):"")+(d.number_of_seasons?" · "+d.number_of_seasons+" sezonów":"");$("description").textContent=x.desc||"Brak opisu.";let pics=(d.images?.backdrops||[]).slice(0,8);if(x.backdrop)pics.unshift({file_path:x.backdrop});lightboxPhotos=pics.map(p=>img(p.file_path,"original"));$("images").innerHTML=pics.length?pics.map((p,i)=>'<button class="tile photo-tile" data-photo-index="'+i+'"><img src="'+esc(img(p.file_path,"w780"))+'" alt="" loading="lazy"><span>Otwórz zdjęcie</span></button>').join(""):"Brak zdjęć.";let vids=(d.videos?.results||[]).filter(v=>v.site==="YouTube"&&(v.type==="Trailer"||v.type==="Teaser")).slice(0,6);$("videos").innerHTML=vids.length?vids.map(v=>'<a class="tile" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+encodeURIComponent(v.key)+'"><img src="https://img.youtube.com/vi/'+encodeURIComponent(v.key)+'/hqdefault.jpg" alt="" loading="lazy"><span>'+esc(v.name||"Zwiastun")+' ↗</span></a>').join(""):"Brak zwiastunów."}catch(e){$("images").textConte function find(id,k){return data[k].find(x=>String(x.id)===String(id))}

$("export").onclick=()=>{const a=document.createElement("a"),b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="biblioteka-filmow-i-seriali.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("import").onclick=()=>$("importfile").click();$("importfile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{if(confirm("Wczytać kopię JSON i zastąpić obecną bibliotekę?")){data=norm(JSON.parse(r.result));save();render();toast("Wczytano kopię JSON.")}}catch(_){toast("Nieprawidłowy plik JSON.")}e.target.value=""};r.readAsText(f)};
